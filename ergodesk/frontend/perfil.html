<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil — ErgoDesk MX</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/perfil.css" />
</head>
<body>

  <nav>
   <a href="index.html" class="logo-link"><span class="logo">ErgoDesk</span></a>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="configurador.html">Configurador</a></li>
      <li><a href="carrito.html">Carrito <span id="carrito-contador"></span></a></li>
      <li><a href="perfil.html">Perfil</a></li>
    </ul>
  </nav>

  <main id="perfil">

    <!-- NO AUTENTICADO -->
    <div id="vista-auth">

      <div id="tabs">
        <button id="tab-login" class="tab activo">Iniciar sesión</button>
        <button id="tab-registro" class="tab">Crear cuenta</button>
      </div>

      <!-- FORMULARIO LOGIN -->
      <div id="form-login">
        <h1>Iniciar sesión</h1>
        <p id="error-login" style="display:none;"></p>
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" placeholder="tucorreo@email.com" maxlength="150" autocomplete="email" />
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" placeholder="Tu contraseña" maxlength="72" autocomplete="current-password" />
        <button id="btn-login">Entrar</button>
      </div>

      <!-- FORMULARIO REGISTRO -->
      <div id="form-registro" style="display:none;">
        <h1>Crear cuenta</h1>
        <p id="error-registro" style="display:none;"></p>
        <label for="registro-nombre">Nombre</label>
        <input type="text" id="registro-nombre" placeholder="Tu nombre completo" autocomplete="name" />
        <small id="requisitos-nombre"></small>
        <label for="registro-email">Correo electrónico</label>
        <input type="email" id="registro-email" placeholder="tucorreo@email.com" maxlength="150" autocomplete="email" />
        <small id="requisitos-email"></small>
        <label for="registro-password">Contraseña</label>
        <input type="password" id="registro-password" placeholder="Contraseña" maxlength="72" autocomplete="new-password" />
        <ul id="requisitos-password">
        <li id="req-longitud">Mínimo 8 caracteres</li>
        <li id="req-mayuscula">Al menos una mayúscula</li>
        <li id="req-numero">Al menos un número</li>
        </ul>
        <button id="btn-registro">Crear cuenta</button>
      </div>
    </div>

    <!-- AUTENTICADO -->
    <div id="vista-perfil" style="display:none;">
      <h1>Hola, <span id="nombre-usuario"></span></h1>
      <p>Correo: <span id="email-usuario"></span></p>
      <button id="btn-cerrar-sesion">Cerrar sesión</button>

      <section id="seccion-direcciones">
        <h2>Mis direcciones</h2>
        <div id="lista-direcciones"></div>
      </section>

      <section id="seccion-pedidos">
        <h2>Mis pedidos</h2>
        <div id="lista-pedidos"></div>
      </section>
    </div>

  </main>

    <footer>
    © ErgoDesk MX ·
    <a href="privacidad.html">Aviso de privacidad</a> ·
    <a href="terminos.html">Términos y condiciones</a>
  </footer>

<script src="js/validar.js"></script>
  <script src="js/store.js"></script>
  <script src="js/direcciones.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
