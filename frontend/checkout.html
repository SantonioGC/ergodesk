<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — ErgoDesk MX</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/carrito.css" />
</head>
<body>

  <nav>
    <a href="index.html" class="logo-link"><span class="logo">ErgoDesk</span></a>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="configurador.html">Configurador</a></li>
      <li><a href="carrito.html">Carrito <span id="carrito-contador"></span></a></li>
      <li><a href="perfil.html">Perfil</a></li>
    </ul>
  </nav>

  <main id="checkout">
    <h1>Finalizar compra</h1>
    <p id="aviso-reserva"></p>
    <p id="error-checkout" style="display:none;"></p>

    <!-- DIRECCION -->
    <section id="paso-1">
      <h2>1. Dirección de envío</h2>
      <div id="lista-direcciones"></div>
      <button id="btn-paso-1">Continuar</button>
    </section>

    <!-- ENVIO -->
    <section id="paso-2" style="display:none;">
      <h2>2. Método de envío</h2>
      <div id="opciones-envio"></div>
      <button id="btn-atras-2">Atrás</button>
      <button id="btn-paso-2">Continuar</button>
    </section>

    <!-- PAGO -->
    <section id="paso-3" style="display:none;">
      <h2>3. Método de pago</h2>
      <div id="opciones-pago"></div>
      <button id="btn-atras-3">Atrás</button>
      <button id="btn-paso-3">Continuar</button>
    </section>

    <!-- RESUMEN Y PAGO -->
    <section id="paso-4" style="display:none;">
      <h2>4. Resumen</h2>
      <div id="lista-resumen"></div>
      <p>Subtotal: <strong id="resumen-subtotal"></strong></p>
      <p>Envío: <strong id="resumen-envio"></strong></p>
      <p>Total: <strong id="resumen-total"></strong></p>
      <p>Pago con: <strong id="resumen-pago"></strong></p>
      <button id="btn-atras-4">Atrás</button>
      <button id="btn-pagar-ok">Pagar con tarjeta</button>
    </section>

    <!-- PRODUCTOS SIN STOCK O CARRITO VACIO -->
    <section id="problemas" style="display:none;">
      <h2>No pudimos reservar tu pedido</h2>
      <p id="mensaje-problemas"></p>
      <ul id="lista-problemas"></ul>
      <a href="carrito.html"><button>Volver al carrito</button></a>
    </section>

    <!-- RESULTADO DEL PAGO -->
    <section id="resultado" style="display:none;">
      <h2 id="titulo-resultado"></h2>
      <p id="mensaje-resultado"></p>
      <button id="btn-reintentar" style="display:none;">Intentar de nuevo</button>
      <a href="perfil.html"><button>Ver mis pedidos</button></a>
      <a href="index.html"><button>Seguir comprando</button></a>
    </section>
  </main>

    <footer>
    © ErgoDesk MX ·
    <a href="privacidad.html">Aviso de privacidad</a> ·
    <a href="terminos.html">Términos y condiciones</a>
  </footer>

<script src="js/validar.js"></script>
  <script src="js/store.js"></script>
  <script src="js/direcciones.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
