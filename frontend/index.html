<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ErgoDesk MX</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- NAV -->
  <nav>
    <span class="logo">ErgoDesk</span>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="configurador.html">Configurador</a></li>
      <li><a href="carrito.html">Carrito <span id="carrito-contador"></span></a></li>
      <li><a href="perfil.html">Perfil</a></li>
    </ul>
  </nav>

  <!-- BÚSQUEDA -->
  <section id="busqueda">
    <input type="text" id="input-busqueda" placeholder="Buscar escritorios, accesorios..." />
    <button id="btn-busqueda">Buscar</button>
  </section>

  <!-- BANNER -->
  <section id="banner">
    <p>Diseña tu escritorio ideal, hecho en México.</p>
    <a href="configurador.html">
      <button>Configurar mi escritorio</button>
    </a>
  </section>

  <!-- CATEGORÍAS -->
  <section id="categorias">
    <h2>Categorías</h2>
    <div id="grid-categorias">
      <button class="btn-categoria activo" data-categoria="todos">Todos</button>
      <button class="btn-categoria" data-categoria="escritorios">Escritorios</button>
      <button class="btn-categoria" data-categoria="accesorios">Accesorios</button>
      <button class="btn-categoria" data-categoria="combos">Combos</button>
    </div>
  </section>

  <!-- PRODUCTOS DESTACADOS -->
  <section id="productos-destacados">
    <h2>Productos destacados</h2>
    <div id="grid-productos"></div>
  </section>

  <!-- RESULTADOS DE BÚSQUEDA -->
  <section id="resultados-busqueda" style="display:none;">
    <h2>Resultados de búsqueda</h2>
    <div id="grid-resultados"></div>
  </section>

  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
